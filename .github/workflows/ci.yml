name: gates

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          cargo --version && cargo clippy --version && cargo fmt --version

      - uses: Swatinem/rust-cache@v2

      - name: gates locales con base Git obligatoria
        env:
          BATUTA_SPEC_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          test -n "$BATUTA_SPEC_BASE"
          ./scripts_ci/local_gates.sh

name: gates

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          cargo --version && cargo clippy --version && cargo fmt --version

      - uses: Swatinem/rust-cache@v2

      - name: formato
        run: cargo fmt --all --check

      # `batuta-contract` es no_std a propósito: es lo que demuestra que no hace
      # E/S. Perder el atributo sería perder la propiedad sin que nada falle.
      - name: cero E/S (no_std)
        run: grep -qx '#!\[no_std\]' crates/batuta-contract/src/lib.rs

      - name: sidecar DSH offline
        run: node sidecar/test_dsh_catalog.mjs

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: tests
        run: cargo test --workspace

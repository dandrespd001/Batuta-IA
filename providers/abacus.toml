# Abacus.AI — el proveedor que originó batuta.
#
# El síntoma que destapó el proyecto: el transporte `abacus_cli` estaba declarado
# en provider_adapters.py:92 del orquestador viejo y **no tenía ejecutor**. Toda
# tarea enrutada a Abacus moría en adapters.py:377 con `unsupported supervised
# transport`, y ZAI GLM 5.3 Flash quedaba detrás de esa pared.
#
# Este fichero es la prueba de la tesis: dar de alta el proveedor es un fichero,
# y no se toca una línea del núcleo.

schema_version = 1
id             = "abacus"
kind           = "cli"

# Medido el 2026-08-27: `command -v abacusai` -> ~/.local/bin/abacusai, que es un
# enlace a shim.cjs. La versión instalada es la 2.6.11, la única que conoce el
# modelo que se quiere usar. El pin del orquestador viejo decía 2.6.9, existía, y
# el resolutor la prefería: R11 se paga aquí. **Y las dos siguen en disco**:
# ~/.abacusai/versions/ tiene 2.6.9 y 2.6.11. La trampa no es histórica, está viva.
[executable]
program       = "~/.local/bin/abacusai"
version_pin   = "2.6.11"
version_probe = ["--version"]
sha256        = "f31200c9e063a16999c69a6bac073635c6e4f17f4e7b0e3302eeb28d40d61f53"
resolve       = ["~/.local/bin/abacusai", "$PATH"]

[auth]
method     = "oauth_cli"
store_path = "~/.abacusai"

# `--disallowed-tools "*"` y `--no-agents-md` existen y están verificados en la
# ayuda de la 2.6.11.
#
# NUNCA se emite `--dangerously-skip-permissions`, que la ayuda ofrece: batuta
# contiene por nombre, y una bandera que apaga la comprobación entera es lo
# contrario de contener.
#
# `prompt.via = "argv"` sale de la forma que documenta su propia ayuda
# (`abacusai [options] [prompt]`). **No está medido si acepta stdin**: se resuelve
# con el canario de la Fase 3, no adivinando aquí.
[invoke]
# `{prompt}` va el ULTIMO y es posicional: `abacusai [options] [prompt]`, medido
# contra `abacusai --help` de la 2.6.11. Faltaba, y sin el la llamada habria
# llegado a Abacus SIN TAREA: el proveedor habria contestado algo plausible y el
# recibo lo habria sellado. Ahora la carga lo exige (`PromptNeverDelivered`).
argv = ["--print", "--model", "{route_model}", "--output-format", "text",
        "--permission-mode", "normal", "--disallowed-tools", "*", "--no-agents-md",
        "{prompt}"]
workdir = "worktree"
prompt  = { via = "argv" }

# `USER` esta aqui por MEDICION, no por costumbre. Sin ella, `abacusai` falla en
# 443 ms con «Unsupported state or unable to authenticate data» —aunque
# `abacusai auth status` con el entorno completo diga que la sesion es valida—,
# porque deriva de `$USER` la clave con que descifra su almacen de credenciales.
# Se bisecaron ocho variables (USER, LOGNAME, SHELL, XDG_RUNTIME_DIR,
# DBUS_SESSION_BUS_ADDRESS, XDG_SESSION_TYPE, DISPLAY) y solo `USER` lo arregla.
#
# R5 no dice «pasa poco»: dice que nada se hereda sin nombrarlo. Una variable
# que hace falta y esta nombrada cumple la regla; una que hace falta y se
# adivina, no.
[env]
allow = ["HOME", "PATH", "TERM", "LANG", "USER"]
set   = { ABACUSAI_NO_TELEMETRY = "1" }

# Sin `[substitutions.reasoning_effort]` a propósito (T1 de docs/FASE5_PANEL.md).
# MEDIDO: `abacusai --help` de la 2.6.11 no ofrece ninguna bandera de esfuerzo,
# razonamiento ni "thinking" -ni corta ni larga-. Existe `--settings <fichero>`
# ("JSON settings file to merge into the config"), pero su esquema no está
# documentado y forzar una llave ahí sería adivinar, no medir (R2). Sin mapa,
# `{reasoning_effort}` no es una llave admitida para este proveedor: usarla
# fallaría al cargar, no en una corrida real.

[response]
parser = "plain_text"

# No hay registro de sesión legible como el de dsh: la procedencia se declara y
# el canario la contrasta. Es más débil que `session_log`, y se dice.
# ── Procedencia ──────────────────────────────────────────────────────────────
# MEDIDO, no supuesto. `abacusai` escribe en su stderr, tras cada corrida:
#
#     model: ZAI_GLM_5_3_FLASH | cwd: /… | conversation: 121470e167
#
# así que su procedencia SI es legible: en otro sitio y otro formato que la de
# dsh. Nueve canarios del 2026-08-28 salieron «sin confirmar» teniendo esa línea
# delante; el tercer valor de `provenance.source` existe por eso.
#
# Es tan observacional como un registro de sesión: lo escribe el proveedor.
[provenance]
source  = "stderr_pattern"
pattern = "model: {model} |"

# QUIÉN ELIGE EL MODELO: **Abacus, no batuta.** El modelo se selecciona dentro
# del producto; `route_model` documenta *qué hay que tener seleccionado allí*, no
# lo que esta bandera impone. `--model` existe en la ayuda de la 2.6.11 y se pasa,
# pero **no está demostrado que sea la autoridad**, y no se va a afirmar que lo sea.
#
# Es la SEGUNDA vez que la bandera no manda sobre el modelo: en dsh, el `--patch`
# aterrizaba en la composición y ganaba el documento de settings. Dos proveedores,
# dos mecanismos distintos, la misma lección: **la bandera no es la autoridad**.
# Por eso el recibo anota lo observado y no lo pedido.
#
# El catálogo vive en el servidor. Búsqueda exhaustiva de «ZAI GLM 5.3 Flash» en
# el paquete npm y en el binario real de 112 MB: CERO coincidencias. No se valida
# estáticamente y no se intenta: lo detecta el canario (ver §4 del esquema).
# Los modelos que el Arquitecto usa en Abacus. `route_model` es el nombre TAL Y
# COMO Abacus lo entiende: opaco, con espacios y mayusculas, pasado literal al
# `argv`. `id` es el nombre canonico dentro de batuta y es un slug.
#
# NINGUNO ESTA AQUI POR DESEO. R2: un modelo sin canario verde y vigente no es
# enrutable, y el manifiesto no es una lista de deseos. Anadir uno son cinco
# lineas MAS un canario que pase; quitarlo son cinco lineas menos. El estado de
# cada uno esta en `docs/medidas/CANARIOS.md`.
#
#     batuta canary --provider abacus --all
#
# es la orden que reparte los permisos.

[[models]]
id              = "abacus-glm-5.3-flash"
route_model     = "ZAI GLM 5.3 Flash"
observed_as     = "ZAI_GLM_5_3_FLASH"
roles           = ["review", "implementation"]
max_sensitivity = "internal"

[[models]]
id              = "abacus-glm-5.3"
route_model     = "ZAI GLM 5.3"
observed_as     = "ZAI_GLM_5_3"
roles           = ["review", "implementation"]
max_sensitivity = "internal"

[[models]]
id              = "abacus-qwen3.8-27b"
route_model     = "Qwen3.8 27B"
observed_as     = "QWEN3_8_27B"
roles           = ["implementation", "boilerplate"]
max_sensitivity = "internal"

# OJO CON ESTE Y CON GEMINI: Abacus resuelve el nombre de pantalla a una
# variante DISTINTA de la pedida. Se pide `Qwen3.8 Max` y se anota
# `QWEN3_8_MAX_THINKING`. Por eso `observed_as` se declara y no se normaliza: un
# normalizador —mayúsculas y espacios a guiones bajos— habría acertado en siete
# de estos nueve y habría tapado justo los dos interesantes. Un normalizador
# convierte una discrepancia en una coincidencia; un alias declarado la conserva.
[[models]]
id              = "abacus-qwen3.8-max"
route_model     = "Qwen3.8 Max"
observed_as     = "QWEN3_8_MAX_THINKING"
roles           = ["review", "implementation"]
max_sensitivity = "internal"

[[models]]
id              = "abacus-qwen3.8-flash-next"
route_model     = "Qwen3.8 Flash Next"
observed_as     = "QWEN3_8_FLASH_NEXT"
roles           = ["implementation", "boilerplate"]
max_sensitivity = "internal"

[[models]]
id              = "abacus-grok-4.5"
route_model     = "Grok 4.5"
observed_as     = "XAI_GROK_4_5"
roles           = ["review", "implementation"]
max_sensitivity = "internal"

[[models]]
id              = "abacus-grok-4.6"
route_model     = "Grok 4.6"
observed_as     = "XAI_GROK_4_6"
roles           = ["review", "implementation"]
max_sensitivity = "internal"

[[models]]
id              = "abacus-gemini-3.7-flash"
route_model     = "Gemini 3.7 Flash"
observed_as     = "GEMINI_3_7_FLASH_THINKING"
roles           = ["implementation", "boilerplate"]
max_sensitivity = "internal"

# RouteLLM no es un modelo: es un enrutador que elige uno por su cuenta. Su
# canario dice si el transporte responde, NUNCA que modelo corrio, y su recibo
# saldra con `model_confirmed: false` como el de cualquier otro de abacus. Que
# batuta enrute a un enrutador es una decision de politica, no de manifiesto.
[[models]]
id              = "abacus-routellm"
route_model     = "RouteLLM"
observed_as     = "ROUTE_LLM"
roles           = ["implementation"]
max_sensitivity = "internal"

[canary]
prompt = "Responde exactamente con: {token}"
expect = "token_echo"

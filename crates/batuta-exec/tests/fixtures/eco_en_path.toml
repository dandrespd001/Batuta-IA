# Proveedor de prueba que se resuelve POR $PATH, no por ruta absoluta.
#
# Existe porque el primer canario resolvía el programa con una búsqueda propia
# —la primera entrada de `resolve` que fuera un fichero— en vez de usar la del
# manifiesto. Esa búsqueda no entiende `~` ni `$PATH`, así que el canario contra
# dsh, cuyo `resolve` empieza por `~`, no habría encontrado nunca su binario.
#
# `$PATH` prueba lo mismo que `~` y no depende de dónde esté instalado nada.
schema_version = 1
id             = "eco-en-path"
kind           = "cli"

[executable]
program       = "echo"
version_pin   = "coreutils"
version_probe = ["--version"]
resolve       = ["$PATH"]

[invoke]
argv    = ["{prompt}"]
workdir = "worktree"
prompt  = { via = "argv" }

[env]
allow = ["HOME", "PATH"]

[auth]
method = "oauth_cli"

[response]
parser = "plain_text"

[provenance]
source = "declared"

[[models]]
id              = "eco-modelo"
route_model     = "eco"
roles           = ["implementation"]
max_sensitivity = "internal"

[canary]
prompt = "Responde exactamente con: {token}"
expect = "token_echo"

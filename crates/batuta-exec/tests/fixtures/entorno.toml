# Proveedor de prueba: /usr/bin/env imprime el entorno que recibe.
#
# R5 no se comprueba leyendo la allowlist: se comprueba mirando qué le llegó al
# hijo. `deny` gana sobre `allow` a propósito, porque hay variables que el
# proveedor lee para decidir su propia contención.
schema_version = 1
id             = "entorno"
kind           = "cli"

# Se invoca `env` a traves de `sh` y no directamente. El motivo no es de estilo:
# con `/usr/bin/env` el `argv` tenia que ir VACIO, y un manifiesto que declara
# entregar el prompt por `argv` y no lo emite es irresoluble —la carga lo
# rechaza desde que existe `PromptNeverDelivered`—. Con `sh -c` el manifiesto
# dice la verdad y el hijo sigue imprimiendo el entorno que recibio.
[executable]
program       = "/bin/sh"
version_pin   = "posix"
version_probe = ["--version"]
resolve       = ["/bin/sh"]

[invoke]
argv    = ["-c", "exec env", "{prompt}"]
workdir = "worktree"
prompt  = { via = "argv" }

[env]
allow = ["HOME", "BATUTA_TESTIGO", "BATUTA_DOBLE"]
deny  = ["BATUTA_DOBLE"]
set   = { BATUTA_FIJADA = "valor-fijado" }

[auth]
method = "oauth_cli"

[response]
parser = "plain_text"

[provenance]
source = "declared"

[[models]]
id              = "entorno-modelo"
route_model     = "entorno"
roles           = ["implementation"]
max_sensitivity = "internal"

[canary]
prompt = "Responde exactamente con: {token}"
expect = "token_echo"
